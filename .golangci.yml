version: "2"
linters:
  enable:
    - depguard
    - errorlint
    - gosec
    - misspell
  settings:
    depguard:
      rules:
        core-is-pure:
          files:
            - "**/internal/core/**"
          deny:
            - pkg: "nibwire/internal/store"
              desc: "core is pure logic; adapters call store"
            - pkg: "nibwire/internal/mailer"
              desc: "core is pure logic; adapters call mailer"
            - pkg: "database/sql"
              desc: "core does no I/O"
            - pkg: "net/http"
              desc: "core does no I/O"
            - pkg: "os"
              desc: "core does no I/O; pass values in"
        checks-is-plain:
          files:
            - "**/internal/core/checks/**"
          deny:
            - pkg: "nibwire/internal/core/render"
              desc: "the checklist reads plain rendered values; internal/presend renders (phase 9 #44)"
formatters:
  enable:
    - gofmt
