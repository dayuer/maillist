{{define "keep.html"}}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<title>{{.Title}}</title>
</head>
<body style="margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#27272a;background:#ffffff;">
<main style="max-width:24rem;margin:20vh auto;padding:0 20px;text-align:center;">
<h1 style="margin:0;font-size:1.125rem;font-weight:600;letter-spacing:-.01em;">{{.Heading}}</h1>
<p style="margin:.375rem 0 0;font-size:.875rem;line-height:1.6;color:#71717a;">{{.Description}}</p>
{{if .Action}}
<form method="post" action="{{.Action}}" style="margin-top:1.5rem;">
<button type="submit" style="width:100%;padding:.875rem 1.5rem;font:inherit;font-size:1.0625rem;font-weight:600;color:#ffffff;background:#18181b;border:0;border-radius:.625rem;cursor:pointer;">{{.Button}}</button>
</form>
{{end}}
</main>
</body>
</html>
{{end}}
