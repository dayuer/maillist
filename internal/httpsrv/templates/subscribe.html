{{define "subscribe.html"}}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>{{.Title}}</title>
</head>
<body style="margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#27272a;background:#ffffff;">
<main style="max-width:24rem;margin:20vh auto;padding:0 20px;text-align:center;">
<h1 style="margin:0;font-size:1.125rem;font-weight:600;letter-spacing:-.01em;">{{.Heading}}</h1>
<p style="margin:.375rem 0 0;font-size:.875rem;line-height:1.6;color:#71717a;">{{.Description}}</p>
{{if .Action}}
<form method="post" action="{{.Action}}" style="margin-top:1.5rem;">
<label for="email" style="display:block;text-align:left;font-size:.875rem;color:#52525b;">Email</label>
<input id="email" name="email" type="email" required autocomplete="email" style="width:100%;margin:.25rem 0 0;padding:.625rem .75rem;font:inherit;border:1px solid #d4d4d8;border-radius:.5rem;box-sizing:border-box;">
<input type="text" name="website" tabindex="-1" autocomplete="off" aria-hidden="true" style="position:absolute;left:-9999px;width:1px;height:1px;">
<button type="submit" style="width:100%;margin-top:.75rem;padding:.75rem 1rem;font:inherit;font-weight:600;color:#ffffff;background:#18181b;border:0;border-radius:.5rem;cursor:pointer;">{{.Button}}</button>
</form>
{{end}}
{{if .Link}}<p style="margin:1.5rem 0 0;font-size:.875rem;"><a href="{{.Link}}" style="color:#18181b;">{{.LinkLabel}}</a></p>{{end}}
</main>
</body>
</html>
{{end}}
