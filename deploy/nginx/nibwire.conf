# nibwire.com on a host whose 443 belongs to something else.
#
# Cloudflare proxies nibwire.com and an Origin Rule sends it to this port; the certificate is a
# Cloudflare Origin CA certificate, so the zone runs Full (strict). Only Cloudflare can reach the
# port (ufw), and the reader's address comes from CF-Connecting-IP via the realip snippet.
#
# Static landing page from /var/www/nibwire; the reader-facing Nibwire routes go to the app on
# 127.0.0.1:8090. The admin API (/api/v1) and MCP are not published.

upstream nibwire_app {
    server 127.0.0.1:8090;
    keepalive 8;
}

server {
    listen 8443 ssl http2;
    listen [::]:8443 ssl http2;
    server_name www.nibwire.com;

    ssl_certificate     /etc/nibwire/tls/origin.pem;
    ssl_certificate_key /etc/nibwire/tls/origin.key;

    return 301 https://nibwire.com$request_uri;
}

server {
    listen 8443 ssl http2 default_server;
    listen [::]:8443 ssl http2 default_server;
    server_name nibwire.com;

    ssl_certificate     /etc/nibwire/tls/origin.pem;
    ssl_certificate_key /etc/nibwire/tls/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    include /etc/nginx/snippets/cloudflare-realip.conf;

    root /var/www/nibwire;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    access_log /var/log/nginx/nibwire.access.log;
    error_log  /var/log/nginx/nibwire.error.log warn;

    # Pages revalidate every time; the assets they name carry a ?v= stamp, so those can be cached.
    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        try_files $uri $uri/ =404;
    }

    location ~* \.(css|js|svg)$ {
        add_header Cache-Control "public, max-age=86400";
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    # Reader-facing app routes: signup, confirm, unsubscribe, tracking, keep, uploads, SES webhook.
    location ~ ^/(subscribe/|confirm$|unsubscribe$|api/unsubscribe$|o/|c/|keep$|uploads/|api/webhooks/ses$) {
        proxy_pass http://nibwire_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        client_max_body_size 64k;
    }
}

# Plain-http requests reach the origin on 80 (the Origin Rule only moves https to 8443); send them
# to https here, since the zone's own "Always Use HTTPS" is out of this deployment's reach.
server {
    listen 80;
    listen [::]:80;
    server_name nibwire.com www.nibwire.com;
    return 301 https://nibwire.com$request_uri;
}
